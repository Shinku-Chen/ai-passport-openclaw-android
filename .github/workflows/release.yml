name: Release APK

# 打包与签名都在 GitHub 上完成:keystore 与口令取自仓库 Secrets
# (AIPASSPORT_KEYSTORE_BASE64 / AIPASSPORT_KEYSTORE_PASSWORD /
#  AIPASSPORT_KEY_ALIAS / AIPASSPORT_KEY_PASSWORD),仓库里只有变量名,没有密钥。
#
# 触发:
#   - push 一个 v* 标签(tag)         → 构建并把签名 APK 挂到该标签的 Release
#   - Actions 页面手动 Run workflow → 只构建并上传为 workflow 产物(便于验证)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # 需要写权限才能创建/更新 Release 并上传资产

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 不用 android-actions/setup-android:它仍会去装已废弃的 `tools` 包并直接失败
      # (Warning: Failed to find package 'tools')。GitHub 的 ubuntu runner 预装 Android SDK,
      # ANDROID_HOME / ANDROID_SDK_ROOT 已就绪,直接用即可。
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" | tail -3

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AIPASSPORT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 AIPASSPORT_KEYSTORE_BASE64 secret"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
          ls -l "$RUNNER_TEMP/keys/release.jks"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed release APK
        env:
          AIPASSPORT_KEYSTORE: ${{ runner.temp }}/keys/release.jks
          AIPASSPORT_KEYSTORE_PASSWORD: ${{ secrets.AIPASSPORT_KEYSTORE_PASSWORD }}
          AIPASSPORT_KEY_ALIAS: ${{ secrets.AIPASSPORT_KEY_ALIAS }}
          AIPASSPORT_KEY_PASSWORD: ${{ secrets.AIPASSPORT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::未产出 app-release.apk"; exit 1; }
          case "$APK" in *unsigned*) echo "::error::APK 未签名(检查 secrets)"; exit 1;; esac
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

      # 发版后把仓库根目录的 versions.json 同步成新版本(App 端「检查更新」读它)。
      # 数据源:本 tag(去掉 v)+ 固件仓的最新 release tag;注释沿用「同版本」时的旧值,
      # 换版本则清空(免得把上一版的说明挂到新版本上)。
      - name: Sync versions.json
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          FW_TAG=$(gh api repos/Shinku-Chen/ai-passport/releases/latest --jq .tag_name || echo "")
          FW_VERSION="${FW_TAG#v}"
          FW_VERSION="${FW_VERSION%%-*}"
          git fetch --depth=1 origin main
          git checkout -B sync-versions origin/main
          python3 - "$VERSION" "$FW_VERSION" "$FW_TAG" <<'PY'
          import datetime, json, pathlib, sys

          version, fw_version, fw_tag = sys.argv[1], sys.argv[2], sys.argv[3]
          path = pathlib.Path("versions.json")
          old = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          old_app = old.get("app") or {}
          old_fw = old.get("firmware") or {}
          manifest = {
              "schema": 1,
              "updated": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "app": {
                  "version": version,
                  "url": "https://github.com/Shinku-Chen/ai-passport-openclaw-android/releases/latest",
                  "notes": (old_app.get("notes") or "") if old_app.get("version") == version else "",
              },
              "firmware": {
                  "version": fw_version,
                  "tag": fw_tag,
                  "url": "https://github.com/Shinku-Chen/ai-passport/releases/latest",
                  "notes": (old_fw.get("notes") or "") if old_fw.get("version") == fw_version else "",
              },
          }
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + chr(10), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          if git diff --cached --quiet; then
            echo "versions.json 无变化"
          else
            git commit -m "chore(release): 同步 versions.json 到 ${VERSION} [skip ci]"
            git push origin HEAD:main
          fi
